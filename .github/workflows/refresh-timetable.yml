name: Refresh timetable data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-timetable.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch this week and next week
        shell: python
        run: |
          import json, urllib.parse, urllib.request, pathlib, datetime, sys

          base = 'https://api.timefor.school/timetable'
          school = {'grade': '2', 'classno': '8', 'schoolcode': '7091455'}

          def fetch_week(week):
              errors = []
              attempts = [
                  {**school, 'week': str(week), 'source': 'comcigan'},
                  {**school, 'week': str(week), 'source': 'auto'},
                  {**school, 'week': str(week)},
              ]
              for params in attempts:
                  url = base + '?' + urllib.parse.urlencode(params)
                  try:
                      req = urllib.request.Request(url, headers={
                          'Accept': 'application/json',
                          'User-Agent': 'TodaySchool-GitHubAction/1.1',
                      })
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      errors.append(f'{url}: {e}')
              raise RuntimeError('\n'.join(errors))

          weeks = {}
          for week in (0, 1):
              weeks[str(week)] = fetch_week(week)

          path = pathlib.Path('timetable.json')
          old_weeks = None
          if path.exists():
              try:
                  old = json.loads(path.read_text(encoding='utf-8'))
                  old_weeks = old.get('weeks')
              except Exception:
                  pass

          if old_weeks == weeks:
              print('Timetable unchanged')
              sys.exit(0)

          payload = {
              'ok': True,
              'weeks': weeks,
              'updatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Timetable cache updated for week 0 and week 1')

      - name: Commit changed timetable
        run: |
          if git diff --quiet -- timetable.json; then
            echo "No timetable change"
            exit 0
          fi
          git config user.name "TodaySchool Bot"
          git config user.email "actions@users.noreply.github.com"
          git add timetable.json
          git commit -m "Update timetable cache"
          git push
