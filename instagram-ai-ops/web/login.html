<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instagram AI Ops 로그인</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:#f6f7fb;color:#16181d;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e7e9ee;border-radius:22px;padding:32px;box-shadow:0 18px 60px rgba(20,25,40,.08)}.logo{font-size:13px;font-weight:800;letter-spacing:.08em;color:#6c63ff}.title{font-size:28px;font-weight:800;margin:10px 0 8px}.desc{color:#777d89;font-size:14px;line-height:1.6;margin-bottom:24px}input{width:100%;height:48px;border:1px solid #dfe2e8;border-radius:12px;padding:0 14px;font-size:15px;outline:none}input:focus{border-color:#6c63ff;box-shadow:0 0 0 3px rgba(108,99,255,.12)}button{width:100%;height:48px;border:0;border-radius:12px;background:#171923;color:#fff;font-weight:800;font-size:15px;margin-top:12px;cursor:pointer}.err{display:none;background:#fff2f2;color:#c0392b;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}</style></head><body><form class="card" method="post" action="/login"><div class="logo">INSTAGRAM AI OPS</div><div class="title">운영앱 로그인</div><div class="desc">개인용 관리 화면입니다. Render에 설정한 앱 비밀번호를 입력하세요.</div><div id="err" class="err">비밀번호가 맞지 않습니다.</div><input type="password" name="password" placeholder="앱 비밀번호" autofocus required><button type="submit">로그인</button></form><script>if(new URLSearchParams(location.search).get('error'))document.getElementById('err').style.display='block'</script></body></html>
